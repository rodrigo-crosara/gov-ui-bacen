<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-contrast="normal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Técnico de Protótipos — BCB Design System</title>
    <meta name="description" content="Casca técnica mínima sem elementos fixos de portal para testes visuais, split-screen de demandas, responsividade e auditoria de contraste de protótipos do BCB.">

    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <!-- Tipografia Institucional (Rawline, Inter, Ubuntu, Cormorant Garamond, Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined & Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">

    <!-- BCB Design System CSS -->
    <link rel="stylesheet" href="../assets/css/bcb-style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1418;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Toolbar técnica de controle */
        .bcb-harness-bar {
            background-color: #1a2228;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .bcb-harness-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
        }
        .bcb-harness-title:hover {
            color: #4dc8ff;
            text-decoration: none;
        }

        .bcb-harness-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c4cbd1;
        }

        .bcb-harness-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .bcb-harness-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bcb-harness-label {
            font-size: 0.75rem;
            color: #9aa6b2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0;
        }

        .bcb-harness-select {
            background: #2a343d;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            outline: none;
            max-width: 270px;
        }

        .bcb-harness-btn-group {
            display: flex;
            background: #2a343d;
            border-radius: 4px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .bcb-harness-btn {
            background: transparent;
            border: none;
            color: #c4cbd1;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .bcb-harness-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }
        .bcb-harness-btn.active {
            background: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
            font-weight: 600;
        }

        /* Container Split-Screen (Gaveta de Demanda + Palco de Renderização) */
        .bcb-harness-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Gaveta Retrátil de Briefing da Demanda */
        .bcb-harness-drawer {
            width: 0;
            opacity: 0;
            visibility: hidden;
            background-color: #141b22;
            color: #c9d1d9;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            transition: width 0.3s ease, opacity 0.2s ease, visibility 0.3s ease;
            overflow-y: auto;
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
        }

        .bcb-harness-layout.drawer-open .bcb-harness-drawer {
            width: 440px;
            opacity: 1;
            visibility: visible;
        }

        .bcb-drawer-header {
            background: #1f2933;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .bcb-drawer-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .bcb-drawer-body {
            padding: 16px;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .bcb-briefing-meta {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--bcb-brand-azul-blue, #025C75);
            padding: 10px 12px;
            border-radius: 0 4px 4px 0;
            margin-bottom: 14px;
        }

        .bcb-briefing-meta dt {
            color: #8b949e;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bcb-briefing-meta dd {
            color: #f0f6fc;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .bcb-briefing-meta dd:last-child {
            margin-bottom: 0;
        }

        .bcb-briefing-raw {
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 12px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.78rem;
            color: #79c0ff;
            white-space: pre-wrap;
            margin-bottom: 14px;
        }

        .bcb-briefing-instruction {
            background: rgba(2, 92, 117, 0.15);
            border: 1px solid rgba(2, 92, 117, 0.4);
            border-radius: 6px;
            padding: 12px;
            color: #e6edf3;
            font-style: italic;
        }

        /* Palco de renderização do protótipo */
        .bcb-harness-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            background-color: #0f1418;
            overflow-y: auto;
            height: calc(100vh - 50px);
            transition: all 0.3s ease;
        }

        .bcb-harness-device {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 80px);
            background: #ffffff;
            transition: width 0.3s ease, max-width 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Modos de Viewport */
        .bcb-harness-device.viewport-desktop {
            width: 100%;
            max-width: 1440px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .bcb-harness-device.viewport-tablet {
            width: 768px;
            max-width: 100%;
            border-radius: 12px;
            border: 8px solid #2a343d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .bcb-harness-device.viewport-mobile {
            width: 375px;
            max-width: 100%;
            border-radius: 24px;
            border: 10px solid #2a343d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .bcb-harness-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
            flex: 1;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Componente Toast de Feedback */
        .bcb-harness-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #1f2933;
            color: #f0f6fc;
            border: 1px solid rgba(74, 222, 128, 0.4);
            border-left: 4px solid #4ade80;
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .bcb-harness-toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .harness-icon-success { color: #4ade80 !important; }
        .harness-icon-info { color: #4dc8ff !important; }
        .harness-badge-file { font-size: 0.72rem; }
        :focus-visible {
            outline: 3px solid #088694 !important;
            outline-offset: 2px !important;
        }

        /* =================================================================
           Casca Institucional Simulada do Portal BCB (Header, Breadcrumbs e Footer)
           ================================================================= */
        .simulated-portal-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: #ffffff;
            color: #212529;
            transition: background-color 0.2s, color 0.2s;
        }

        .simulated-barra-brasil {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 4px 16px;
            font-size: 0.75rem;
            color: #4a5568;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .simulated-barra-brasil a {
            color: #4a5568;
            text-decoration: none;
        }
        .simulated-barra-brasil a:hover {
            color: var(--bcb-brand-azul-blue, #025C75);
            text-decoration: underline;
        }
        .simulated-gov-badge {
            font-weight: 700;
            color: #1a202c;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .simulated-header-bcb {
            background-color: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .simulated-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .simulated-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
        }
        .simulated-brand:hover {
            color: #ffffff;
            text-decoration: none;
        }
        .simulated-brand-logo {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .simulated-brand-text {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .simulated-brand-sub {
            font-size: 0.7rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
        }
        .simulated-header-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
        }
        .simulated-nav-link {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .simulated-nav-link:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.15);
            text-decoration: none;
        }

        .simulated-breadcrumbs-bar {
            background-color: var(--bcb-gray-50, #f8f9fa);
            border-bottom: 1px solid var(--bcb-gray-200, #e9ecef);
            padding: 8px 16px;
            font-size: 0.8rem;
        }
        .simulated-breadcrumbs-bar .breadcrumb {
            margin: 0;
            padding: 0;
            background: transparent;
            font-size: 0.8rem;
        }
        .simulated-breadcrumbs-bar .breadcrumb-item a {
            color: var(--bcb-brand-azul-blue, #025C75);
            text-decoration: none;
        }
        .simulated-breadcrumbs-bar .breadcrumb-item a:hover {
            text-decoration: underline;
        }
        .simulated-breadcrumbs-bar .breadcrumb-item.active {
            color: #6c757d;
        }

        .simulated-content-stage {
            width: 100%;
            background: #ffffff;
            min-height: 520px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .simulated-footer-bcb {
            background-color: var(--bcb-brand-azulpetro, #2E4C59);
            color: #ffffff;
            padding: 24px 16px 14px;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-top: auto;
        }
        .simulated-footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .simulated-footer-title {
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--bcb-brand-amarellato, #F8D48D);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .simulated-footer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .simulated-footer-list li {
            margin-bottom: 4px;
        }
        .simulated-footer-list a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
        }
        .simulated-footer-list a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .simulated-footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 10px;
            text-align: center;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.7);
        }

        /* Temas na Casca Simulada */
        #deviceContainer[data-theme="dark"] .simulated-portal-shell,
        #deviceContainer[data-theme="dark"] .simulated-content-stage {
            background: #121212;
            color: #e6edf3;
        }
        #deviceContainer[data-theme="dark"] .simulated-barra-brasil {
            background-color: #0d1117;
            border-bottom-color: #30363d;
            color: #8b949e;
        }
        #deviceContainer[data-theme="dark"] .simulated-gov-badge {
            color: #f0f6fc;
        }
        #deviceContainer[data-theme="dark"] .simulated-header-bcb {
            background-color: #16242c;
            border-bottom: 1px solid #30363d;
        }
        #deviceContainer[data-theme="dark"] .simulated-breadcrumbs-bar {
            background-color: #161b22;
            border-bottom-color: #30363d;
        }
        #deviceContainer[data-theme="dark"] .simulated-breadcrumbs-bar .breadcrumb-item a {
            color: #58a6ff;
        }
        #deviceContainer[data-theme="dark"] .simulated-breadcrumbs-bar .breadcrumb-item.active {
            color: #8b949e;
        }
        #deviceContainer[data-theme="dark"] .simulated-footer-bcb {
            background-color: #0d1117;
            border-top: 1px solid #30363d;
        }

        #deviceContainer[data-contrast="high"] .simulated-portal-shell,
        #deviceContainer[data-contrast="high"] .simulated-content-stage {
            background: #000000 !important;
            color: #ffffff !important;
        }
        #deviceContainer[data-contrast="high"] .simulated-barra-brasil,
        #deviceContainer[data-contrast="high"] .simulated-header-bcb,
        #deviceContainer[data-contrast="high"] .simulated-breadcrumbs-bar,
        #deviceContainer[data-contrast="high"] .simulated-footer-bcb {
            background: #000000 !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
        }
        #deviceContainer[data-contrast="high"] a {
            color: #ffff00 !important;
        }
    </style>
</head>
<body>

    <!-- BARRA TÉCNICA DE CONTROLE (Exclusiva do Harness / Ocultada em Produção) -->
    <header class="bcb-harness-bar" role="banner" aria-label="Controles de Homologação do Harness">
        <a href="../pages/prototipos.html" class="bcb-harness-title">
            <span class="material-symbols-outlined material-icons md-18" aria-hidden="true">dashboard</span>
            <span>Harness de Visualização Técnica</span>
            <span class="bcb-harness-badge">Protótipos BCB</span>
        </a>

        <div class="bcb-harness-controls">
            <!-- Seletor de Protótipos (Primeiro controle de foco operacional) -->
            <div class="bcb-harness-group">
                <label for="selectPrototipo" class="bcb-harness-label">Tela:</label>
                <select id="selectPrototipo" class="bcb-harness-select" aria-label="Selecionar protótipo para visualização">
                    <optgroup label="Protótipos Oficiais (Produção)">
                        <option value="copom-decisao-taxa-selic.html">Copom: Taxa Selic &amp; Série SGS 432</option>
                        <option value="sgs-series-taxa-selic.html">SGS: Painel Analítico &amp; Dados Abertos</option>
                        <option value="mecanismo-especial-devolucao-med.html">Serviço: MED Pix com Stepper e Alerta</option>
                        <option value="regras-cheque-especial.html">Regulação: Limite Cheque Especial (70/30)</option>
                        <option value="resolucao-bcb-dou.html">Regulação: Resolução BCB nº 492 (DOU / Comef)</option>
                    </optgroup>
                </select>
            </div>

            <!-- Botão de Briefing Retrátil (Split-Screen) com Contratos ARIA -->
            <button type="button" id="btnToggleBriefing" class="bcb-harness-btn" aria-expanded="false" aria-controls="briefingDrawer" title="Exibir/Ocultar Briefing da Demanda Original (.docs-ia/)">
                <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">description</span>
                <span>Briefing da Demanda</span>
            </button>

            <!-- Alternador de Viewport (Desktop / Tablet / Mobile) -->
            <div class="bcb-harness-group">
                <span class="bcb-harness-label">Viewport:</span>
                <div class="bcb-harness-btn-group" role="group" aria-label="Alternador de viewport">
                    <button type="button" class="bcb-harness-btn active" data-viewport="desktop" title="Desktop (100% / max-width 1440px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">desktop_windows</span> Desktop
                    </button>
                    <button type="button" class="bcb-harness-btn" data-viewport="tablet" title="Tablet (768px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">tablet_mac</span> Tablet (768px)
                    </button>
                    <button type="button" class="bcb-harness-btn" data-viewport="mobile" title="Mobile (375px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">smartphone</span> Mobile (375px)
                    </button>
                </div>
            </div>

            <!-- Alternador de Temas (Padrão / Escuro / Alto Contraste) -->
            <div class="bcb-harness-group">
                <span class="bcb-harness-label">Tema:</span>
                <div class="bcb-harness-btn-group" role="group" aria-label="Alternador de tema do protótipo">
                    <button type="button" class="bcb-harness-btn active" data-theme-target="default" title="Modo Claro Institucional">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">light_mode</span> Padrão
                    </button>
                    <button type="button" class="bcb-harness-btn" data-theme-target="dark" title="Modo Escuro (Dark Mode)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">dark_mode</span> Escuro
                    </button>
                    <button type="button" class="bcb-harness-btn" data-theme-target="high-contrast" title="Alto Contraste WCAG AAA">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">contrast</span> Contraste
                    </button>
                </div>
            </div>

            <!-- Ação Rápida: Copiar HTML do Miolo -->
            <div class="bcb-harness-group">
                <button type="button" id="btnCopyMain" class="bcb-harness-btn" title="Copiar HTML do miolo (<main>) limpo para inclusão no CMS">
                    <span class="material-symbols-outlined material-icons md-16 harness-icon-success" aria-hidden="true">content_copy</span>
                    <span>Copiar HTML do Miolo</span>
                </button>
            </div>
        </div>
    </header>

    <!-- PALCO CENTRALIZADO COM SPLIT-SCREEN (GAVETA DE BRIEFING + DISPOSITIVO) -->
    <main id="conteudo-principal" class="bcb-harness-layout">
        <h1 class="sr-only">Visualizador Técnico de Protótipos — Banco Central do Brasil</h1>

        <!-- Gaveta Retrátil de Briefing da Demanda -->
        <aside id="briefingDrawer" class="bcb-harness-drawer" aria-label="Painel de Briefing da Demanda" aria-hidden="true">
            <div class="bcb-drawer-header">
                <h2 class="bcb-drawer-title">
                    <span class="material-symbols-outlined material-icons md-18 harness-icon-info" aria-hidden="true">assignment</span>
                    <span id="briefingTitle">Briefing da Demanda</span>
                </h2>
                <button type="button" id="btnCloseDrawer" class="bcb-harness-btn" aria-label="Fechar painel de briefing" title="Fechar Painel de Briefing">
                    <span class="material-symbols-outlined material-icons md-18" aria-hidden="true">close</span>
                </button>
            </div>
            <div id="briefingContent" class="bcb-drawer-body">
                <!-- Conteúdo renderizado dinamicamente via JS -->
            </div>
        </aside>

        <!-- Palco do Dispositivo (Visualizador com Casca Institucional Fixa Embutida Apenas no Frame) -->
        <div class="bcb-harness-stage">
            <div id="deviceContainer" class="bcb-harness-device viewport-desktop" data-theme="light" data-contrast="normal">
                <iframe id="previewFrame" class="bcb-harness-frame" title="Quadro de Visualização do Protótipo Oficial"></iframe>
            </div>
        </div>
    </main>

    <!-- Componente Toast de Feedback (Acessível) -->

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"><\/script>
    <script src="../assets/js/bcb-ui.js"><\/script>
</body>
</html>`;
            }

            async function loadPrototype(slug) {
                currentSlug = slug;
                renderBriefing(slug);

                let mainHtml = '';
                try {
                    const res = await fetch(slug);
                    if (res.ok) {
                        const rawText = await res.text();
                        const matchMain = rawText.match(/<main[\s\S]*?<\/main>/i);
                        if (matchMain) {
                            mainHtml = matchMain[0];
                        } else if (rawText.includes('<body')) {
                            const matchBody = rawText.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                            mainHtml = matchBody ? `<main id="conteudo-principal" class="bcb-container container py-4 mb-5">${matchBody[1]}</main>` : rawText;
                        } else {
                            mainHtml = `<main id="conteudo-principal" class="bcb-container container py-4 mb-5">${rawText}</main>`;
                        }
                    }
                } catch (e) {
                    console.warn('Fetch fallback (file:///):', e);
                }

                if (mainHtml) {
                    currentMainHtml = mainHtml;
                    frame.srcdoc = getShellHtml(mainHtml, slug, currentTheme);
                } else {
                    frame.src = slug;
                }
            }

            function applyThemeToFrame(theme) {
                currentTheme = theme;
                themeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-theme-target') === theme);
                });

                const themeAttr = (theme === 'dark') ? 'dark' : (theme === 'high-contrast' ? 'high-contrast' : 'light');
                const contrastAttr = (theme === 'high-contrast') ? 'high' : 'normal';

                if (deviceContainer) {
                    deviceContainer.setAttribute('data-theme', themeAttr);
                    deviceContainer.setAttribute('data-contrast', contrastAttr);
                }

                try {
                    const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
                    if (doc && doc.documentElement) {
                        doc.documentElement.setAttribute('data-theme', themeAttr);
                        doc.documentElement.setAttribute('data-contrast', contrastAttr);
                    }
                } catch(e) {
                    console.warn('Frame theme context:', e);
                }
            }

            function setViewport(viewport) {
                viewportButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-viewport') === viewport);
                });
                deviceContainer.className = `bcb-harness-device viewport-${viewport}`;
            }

            function toggleDrawer(forceState) {
                const isOpen = typeof forceState === 'boolean' ? forceState : !harnessLayout.classList.contains('drawer-open');
                harnessLayout.classList.toggle('drawer-open', isOpen);
                btnToggleBriefing.classList.toggle('active', isOpen);
                btnToggleBriefing.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                briefingDrawer.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
                if (isOpen) {
                    btnCloseDrawer.focus();
                } else if (document.activeElement === btnCloseDrawer || briefingDrawer.contains(document.activeElement)) {
                    btnToggleBriefing.focus();
                }
            }

            selectPrototipo.addEventListener('change', (e) => {
                const val = e.target.value;
                const slug = val.split('/').pop();
                loadPrototype(slug);
            });

            frame.addEventListener('load', () => {
                applyThemeToFrame(currentTheme);
                try {
                    const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
                    if (doc) {
                        if (!doc.querySelector('.simulated-header-bcb')) {
                            const mainEl = doc.querySelector('main#conteudo-principal') || doc.querySelector('main');
                            if (mainEl) {
                                currentMainHtml = mainEl.outerHTML;

                                // Extrair dinamicamente categoria e título do miolo
                                let areaExtraida = 'Serviços e Informações';
                                let titleExtraido = currentSlug ? currentSlug.replace('.html', '').replace(/-/g, ' ') : 'Protótipo';

                                const tagEl = mainEl.querySelector('.tag-bcb');
                                if (tagEl && tagEl.textContent.trim()) areaExtraida = tagEl.textContent.trim();

                                const h1El = mainEl.querySelector('h1.bcb-page-title') || mainEl.querySelector('h1');
                                if (h1El && h1El.textContent.trim()) titleExtraido = h1El.textContent.trim();

                                const fallback = AREAS[currentSlug] || {};
                                const finalArea = fallback.area || areaExtraida;
                                const finalTitle = fallback.title || titleExtraido;

                                doc.title = `${finalTitle} — Banco Central do Brasil`;
                                if (!doc.documentElement.getAttribute('lang')) {
                                    doc.documentElement.setAttribute('lang', 'pt-BR');
                                }

                                // Se o fragmento não possuir as folhas de estilo essenciais, injetá-las
                                if (!doc.querySelector('link[href*="bcb-style.css"]')) {
                                    if (!doc.querySelector('meta[name="viewport"]')) {
                                        const metaVp = doc.createElement('meta');
                                        metaVp.name = 'viewport';
                                        metaVp.content = 'width=device-width, initial-scale=1.0';
                                        doc.head.appendChild(metaVp);
                                    }

                                    const linkBs = doc.createElement('link');
                                    linkBs.rel = 'stylesheet';
                                    linkBs.href = 'https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css';
                                    doc.head.appendChild(linkBs);

                                    const linkFonts = doc.createElement('link');
                                    linkFonts.rel = 'stylesheet';
                                    linkFonts.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;600&family=Ubuntu:wght@400;500;700&display=swap';
                                    doc.head.appendChild(linkFonts);

                                    const linkSymbols = doc.createElement('link');
                                    linkSymbols.rel = 'stylesheet';
                                    linkSymbols.href = 'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200';
                                    doc.head.appendChild(linkSymbols);

                                    const linkIcons = doc.createElement('link');
                                    linkIcons.rel = 'stylesheet';
                                    linkIcons.href = 'https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined';
                                    doc.head.appendChild(linkIcons);

                                    const linkBcb = doc.createElement('link');
                                    linkBcb.rel = 'stylesheet';
                                    linkBcb.href = '../assets/css/bcb-style.css';
                                    doc.head.appendChild(linkBcb);
                                }

                                const styleEl = doc.createElement('style');
                                styleEl.textContent = `
                                    body { margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bcb-color-surface, #ffffff); color: var(--bcb-color-text, #212529); }
                                    .simulated-barra-brasil { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 4px 16px; font-size: 0.75rem; color: #4a5568; }
                                    .simulated-barra-brasil-inner { max-width: 1440px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
                                    .simulated-gov-badge { font-weight: 700; color: #1a202c; display: inline-flex; align-items: center; gap: 4px; }
                                    .simulated-header-bcb { background-color: var(--bcb-brand-azul-blue, #025C75); color: #ffffff; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
                                    .simulated-header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; max-width: 1440px; margin: 0 auto; width: 100%; }
                                    .simulated-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #ffffff; }
                                    .simulated-brand-logo { width: 36px; height: 36px; background: rgba(255,255,255,0.15); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.3); }
                                    .simulated-brand-text { font-size: 1rem; font-weight: 700; }
                                    .simulated-brand-sub { font-size: 0.7rem; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; display: block; }
                                    .simulated-header-nav { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; }
                                    .simulated-nav-link { color: rgba(255,255,255,0.9); text-decoration: none; padding: 4px 8px; border-radius: 4px; }
                                    .simulated-breadcrumbs-bar { background-color: var(--bcb-gray-50, #f8f9fa); border-bottom: 1px solid var(--bcb-gray-200, #e9ecef); padding: 8px 16px; font-size: 0.8rem; }
                                    .simulated-breadcrumbs-bar-inner { max-width: 1440px; margin: 0 auto; width: 100%; }
                                    .simulated-footer-bcb { background-color: var(--bcb-brand-azulpetro, #2E4C59); color: #ffffff; padding: 24px 16px 14px; font-size: 0.8rem; margin-top: auto; }
                                    .simulated-footer-inner { max-width: 1440px; margin: 0 auto; width: 100%; }
                                    .simulated-footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
                                    .simulated-footer-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; color: var(--bcb-brand-amarellato, #F8D48D); text-transform: uppercase; }
                                    .simulated-footer-list { list-style: none; padding: 0; margin: 0; }
                                    .simulated-footer-list li { margin-bottom: 4px; }
                                    .simulated-footer-list a { color: rgba(255,255,255,0.85); text-decoration: none; }
                                    .simulated-footer-bottom { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; text-align: center; font-size: 0.72rem; color: rgba(255,255,255,0.7); }
                                    [data-theme="dark"] body { background: #121212 !important; color: #e6edf3 !important; }
                                    [data-theme="dark"] .simulated-barra-brasil { background-color: #0d1117 !important; border-bottom-color: #30363d !important; color: #8b949e !important; }
                                    [data-theme="dark"] .simulated-gov-badge { color: #f0f6fc !important; }
                                    [data-theme="dark"] .simulated-header-bcb { background-color: #16242c !important; border-bottom: 1px solid #30363d; }
                                    [data-theme="dark"] .simulated-breadcrumbs-bar { background-color: #161b22 !important; border-bottom-color: #30363d !important; }
                                    [data-theme="dark"] .simulated-footer-bcb { background-color: #0d1117 !important; border-top: 1px solid #30363d; }
                                    [data-contrast="high"] body, [data-contrast="high"] .simulated-barra-brasil, [data-contrast="high"] .simulated-header-bcb, [data-contrast="high"] .simulated-breadcrumbs-bar, [data-contrast="high"] .simulated-footer-bcb { background: #000000 !important; color: #ffffff !important; border-color: #ffffff !important; }
                                `;
                                doc.head.appendChild(styleEl);

                                const shellHeader = document.createElement('div');
                                shellHeader.innerHTML = `
                                    <div class="simulated-barra-brasil" role="region" aria-label="Barra de Governo Federal Simulada">
                                        <div class="simulated-barra-brasil-inner">
                                            <span class="simulated-gov-badge"><span class="material-symbols-outlined material-icons md-16" style="color: #0080A4;" aria-hidden="true">flag</span><span>BRASIL</span></span>
                                            <div class="d-none d-sm-flex align-items-center gap-3"><a href="#">Órgãos do Governo</a><a href="#">Acesso à Informação</a><a href="#">Legislação</a><a href="#">Acessibilidade</a></div>
                                        </div>
                                    </div>
                                    <header class="simulated-header-bcb" role="banner" aria-label="Cabeçalho Institucional do Banco Central Simulado">
                                        <div class="simulated-header-inner">
                                            <div class="simulated-brand">
                                                <div class="simulated-brand-logo" aria-hidden="true">BC</div>
                                                <div><span class="simulated-brand-text">BANCO CENTRAL DO BRASIL</span><span class="simulated-brand-sub">Portal Oficial Institucional</span></div>
                                            </div>
                                            <nav class="simulated-header-nav d-none d-md-flex" aria-label="Navegação Institucional Simulada">
                                                <a href="#" class="simulated-nav-link">Institucional</a><a href="#" class="simulated-nav-link">Política Monetária</a><a href="#" class="simulated-nav-link">Estabilidade Financeira</a><a href="#" class="simulated-nav-link">Estatísticas</a><a href="#" class="simulated-nav-link">Cidadania Financeira</a>
                                            </nav>
                                        </div>
                                    </header>
                                    <div class="simulated-breadcrumbs-bar" role="navigation" aria-label="Trilha de navegação institucional fixa">
                                        <div class="simulated-breadcrumbs-bar-inner">
                                            <ol class="breadcrumb mb-0">
                                                <li class="breadcrumb-item"><a href="#"><span class="material-symbols-outlined material-icons md-16" style="vertical-align: text-bottom;" aria-hidden="true">home</span> Início</a></li>
                                                <li class="breadcrumb-item"><a href="#" id="simulatedBreadcrumbArea">${finalArea}</a></li>
                                                <li class="breadcrumb-item active" aria-current="page" id="simulatedBreadcrumbTitle">${finalTitle}</li>
                                            </ol>
                                        </div>
                                    </div>
                                `;
                                doc.body.insertBefore(shellHeader, mainEl);

                                const shellFooter = document.createElement('footer');
                                shellFooter.className = 'simulated-footer-bcb';
                                shellFooter.setAttribute('role', 'contentinfo');
                                shellFooter.setAttribute('aria-label', 'Rodapé Institucional do Banco Central Simulado');
                                shellFooter.innerHTML = `
                                    <div class="simulated-footer-inner">
                                        <div class="simulated-footer-grid">
                                            <div><div class="simulated-footer-title">Banco Central do Brasil</div><p class="mb-2 text-white-50 small">Autarquia federal vinculada ao Ministério da Fazenda.</p><p class="mb-0 text-white-50 small">SBS Quadra 3 Bloco B — Edifício-Sede<br>Brasília — DF &bull; CEP: 70074-900</p></div>
                                            <div><div class="simulated-footer-title">Canais de Atendimento</div><ul class="simulated-footer-list"><li><a href="#">Fale Conosco</a></li><li><a href="#">Ouvidoria BCB: 145</a></li><li><a href="#">e-SIC (Acesso à Informação)</a></li><li><a href="#">Registrato</a></li></ul></div>
                                            <div><div class="simulated-footer-title">Transparência e Regulação</div><ul class="simulated-footer-list"><li><a href="#">Atos Normativos e Resoluções</a></li><li><a href="#">Estatísticas e Séries SGS</a></li><li><a href="#">Políticas de Privacidade e Cookies</a></li><li><a href="#">Termos de Uso e Padrões Web</a></li></ul></div>
                                        </div>
                                        <div class="simulated-footer-bottom"><span>&copy; Banco Central do Brasil — Todos os direitos reservados. (Casca Institucional Fixa do Portal)</span></div>
                                    </div>
                                `;
                                doc.body.appendChild(shellFooter);

                                // Injetar scripts de comportamento se ausentes
                                if (!doc.querySelector('script[src*="bcb-ui.js"]')) {
                                    const scriptJq = doc.createElement('script');
                                    scriptJq.src = 'https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js';
                                    doc.body.appendChild(scriptJq);

                                    const scriptBs = doc.createElement('script');
                                    scriptBs.src = 'https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js';
                                    doc.body.appendChild(scriptBs);

                                    const scriptBcb = doc.createElement('script');
                                    scriptBcb.src = '../assets/js/bcb-ui.js';
                                    doc.body.appendChild(scriptBcb);
                                }
                            }
                        } else {
                            const mainEl = doc.querySelector('main#conteudo-principal') || doc.querySelector('main');
                            if (mainEl) currentMainHtml = mainEl.outerHTML;
                        }
                    }
                } catch (err) {
                    console.warn('Frame load processing:', err);
                }
            });

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    applyThemeToFrame(btn.getAttribute('data-theme-target'));
                });
            });

            viewportButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setViewport(btn.getAttribute('data-viewport'));
                });
            });

            btnToggleBriefing.addEventListener('click', () => toggleDrawer());
            btnCloseDrawer.addEventListener('click', () => toggleDrawer(false));

            // Fechamento da gaveta de briefing via tecla Escape (WCAG 2.1)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' || e.key === 'Esc') {
                    if (harnessLayout.classList.contains('drawer-open')) {
                        toggleDrawer(false);
                    }
                }
            });

            // Suporte a abertura direta parametrizada: _harness.html?src=...&doc=...
            const urlParams = new URLSearchParams(window.location.search);
            const paramSrc = urlParams.get('src');
            const paramDoc = urlParams.get('doc');

            let prototipoInicial = 'copom-decisao-taxa-selic.html';
            if (paramSrc) {
                prototipoInicial = paramSrc;
                for (let i = 0; i < selectPrototipo.options.length; i++) {
                    if (selectPrototipo.options[i].value === paramSrc || selectPrototipo.options[i].value.endsWith(paramSrc)) {
                        selectPrototipo.selectedIndex = i;
                        break;
                    }
                }
            }

            // Se paramDoc ou paramSrc foi informado, abre o split-screen de briefing automaticamente
            if (paramDoc || paramSrc) {
                toggleDrawer(true);
            }

            // Utilitário de Cópia do HTML do Miolo (<main>) com Toast
            const btnCopyMain = document.getElementById('btnCopyMain');
            const harnessToast = document.getElementById('harnessToast');
            const toastMessage = document.getElementById('toastMessage');
            let toastTimeout = null;

            function showToast(msg, isSuccess = true) {
                toastMessage.textContent = msg;
                harnessToast.style.borderLeftColor = isSuccess ? '#4ade80' : '#f87171';
                harnessToast.classList.add('show');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    harnessToast.classList.remove('show');
                }, 3000);
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('HTML do miolo (<main>) copiado com sucesso! Pronto para colar no CMS.');
                } catch (e) {
                    showToast('Não foi possível copiar automaticamente.', false);
                }
                document.body.removeChild(textarea);
            }

            if (btnCopyMain) {
                btnCopyMain.addEventListener('click', () => {
                    try {
                        let htmlToCopy = currentMainHtml;
                        if (!htmlToCopy) {
                            const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
                            if (doc) {
                                const mainEl = doc.querySelector('main#conteudo-principal') || doc.querySelector('main');
                                if (mainEl) htmlToCopy = mainEl.outerHTML;
                            }
                        }
                        if (!htmlToCopy) throw new Error('Elemento <main> não encontrado no protótipo');

                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(htmlToCopy).then(() => {
                                showToast('HTML do miolo (<main>) copiado com sucesso! Pronto para colar no CMS.');
                            }).catch(() => {
                                fallbackCopy(htmlToCopy);
                            });
                        } else {
                            fallbackCopy(htmlToCopy);
                        }
                    } catch (err) {
                        console.error('Erro ao copiar miolo:', err);
                        showToast('Erro ao copiar HTML do miolo.', false);
                    }
                });
            }

            // Inicialização do briefing e carregamento do protótipo no frame
            const slugInicial = prototipoInicial.split('/').pop();
            loadPrototype(slugInicial);
        })();
    </script>
