<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-contrast="normal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Técnico de Protótipos — BCB Design System</title>
    <meta name="description" content="Visualizador técnico para homologação de responsividade e visualização de protótipos autônomos do Banco Central do Brasil.">

    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <!-- Tipografia Institucional (Rawline, Inter, Ubuntu, Cormorant Garamond, Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined & Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">

    <!-- BCB Design System CSS -->
    <link rel="stylesheet" href="../assets/css/bcb-style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1418;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: var(--bcb-font-ubuntu, sans-serif);
        }

        /* Toolbar técnica de controle */
        .bcb-harness-bar {
            background-color: #1a2228;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            z-index: 1000;
        }

        .bcb-harness-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
        }
        .bcb-harness-title:hover {
            color: #4dc8ff;
            text-decoration: none;
        }

        .bcb-harness-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c4cbd1;
        }

        .bcb-harness-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .bcb-harness-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bcb-harness-label {
            font-size: 0.75rem;
            color: #9aa6b2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0;
        }

        .bcb-harness-select {
            background: #2a343d;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.82rem;
            outline: none;
            min-width: 260px;
        }
        .bcb-harness-select:focus {
            border-color: #4dc8ff;
        }

        .bcb-harness-btn-group {
            display: flex;
            background: #2a343d;
            border-radius: 4px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .bcb-harness-btn {
            background: transparent;
            border: none;
            color: #c4cbd1;
            padding: 5px 12px;
            font-size: 0.78rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }
        .bcb-harness-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            text-decoration: none;
        }
        .bcb-harness-btn.active {
            background: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
            font-weight: 600;
        }

        .bcb-harness-btn--action {
            background: #2a343d;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .bcb-harness-btn--action:hover {
            background: rgba(2, 92, 117, 0.4);
            border-color: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
        }

        /* Container principal */
        .bcb-harness-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background-color: #0f1418;
            height: calc(100vh - 49px);
        }

        /* Palco de renderização (#previewStage) */
        #previewStage {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            background-color: #0f1418;
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* Container do dispositivo / iframe (#previewFrameWrapper) */
        #previewFrameWrapper {
            background: #ffffff;
            transition: width 0.25s ease, max-width 0.25s ease, height 0.25s ease, box-shadow 0.25s ease, border 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* MODO DESKTOP: 100% da largura e altura disponíveis, sem moldura visual */
        #previewStage.mode-desktop {
            padding: 0;
            overflow: hidden;
            align-items: stretch;
        }

        #previewFrameWrapper.viewport-desktop {
            width: 100%;
            height: 100%;
            max-width: 100%;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* MODO TABLET (768px): centralizado com moldura visual */
        #previewStage.mode-tablet {
            padding: 24px 16px;
            overflow-y: auto;
            align-items: flex-start;
        }

        #previewFrameWrapper.viewport-tablet {
            width: 768px;
            max-width: 100%;
            height: 90vh;
            min-height: 700px;
            border-radius: 12px;
            border: 8px solid #2a343d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* MODO MOBILE (375px): centralizado com moldura visual */
        #previewStage.mode-mobile {
            padding: 24px 16px;
            overflow-y: auto;
            align-items: flex-start;
        }

        #previewFrameWrapper.viewport-mobile {
            width: 375px;
            max-width: 100%;
            height: 90vh;
            min-height: 640px;
            border-radius: 24px;
            border: 10px solid #2a343d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Iframe do protótipo */
        .bcb-harness-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
            flex: 1;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        :focus-visible {
            outline: 3px solid #088694 !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body>

    <!-- BARRA TÉCNICA DE CONTROLE -->
    <header class="bcb-harness-bar" role="banner" aria-label="Controles do Visualizador de Protótipos">
        <a href="../pages/prototipos.html" class="bcb-harness-title">
            <span class="material-symbols-outlined material-icons md-18" aria-hidden="true">arrow_back</span>
            <span>Visualizador de Protótipos</span>
            <span class="bcb-harness-badge">BCB</span>
        </a>

        <div class="bcb-harness-controls">
            <!-- Seletor de Protótipos -->
            <div class="bcb-harness-group">
                <label for="selectPrototipo" class="bcb-harness-label">Tela:</label>
                <select id="selectPrototipo" class="bcb-harness-select" aria-label="Selecionar protótipo para visualização">
                    <option value="copom-decisao-taxa-selic.html">Copom: Taxa Selic &amp; Série SGS 432</option>
                    <option value="sgs-series-taxa-selic.html">SGS: Painel Analítico &amp; Dados Abertos</option>
                    <option value="mecanismo-especial-devolucao-med.html">Serviço: MED Pix com Stepper e Alerta</option>
                    <option value="regras-cheque-especial.html">Regulação: Limite Cheque Especial (70/30)</option>
                    <option value="resolucao-bcb-dou.html">Regulação: Resolução BCB nº 492 (DOU / Comef)</option>
                </select>
            </div>

            <!-- Alternador de Resolução (Desktop, Tablet 768px, Mobile 375px) -->
            <div class="bcb-harness-group">
                <span class="bcb-harness-label">Resolução:</span>
                <div class="bcb-harness-btn-group" role="group" aria-label="Alternador de resolução">
                    <button type="button" class="bcb-harness-btn active" data-viewport="desktop" title="Desktop (100%)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">desktop_windows</span> Desktop
                    </button>
                    <button type="button" class="bcb-harness-btn" data-viewport="tablet" title="Tablet (768px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">tablet_mac</span> Tablet (768px)
                    </button>
                    <button type="button" class="bcb-harness-btn" data-viewport="mobile" title="Mobile (375px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">smartphone</span> Mobile (375px)
                    </button>
                </div>
            </div>

            <!-- Link para abrir arquivo diretamente em nova aba -->
            <div class="bcb-harness-group">
                <a id="btnOpenNewTab" href="copom-decisao-taxa-selic.html" target="_blank" rel="noopener noreferrer" class="bcb-harness-btn bcb-harness-btn--action" title="Abrir protótipo diretamente em nova aba">
                    <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">open_in_new</span>
                    <span>Abrir em nova aba</span>
                </a>
            </div>
        </div>
    </header>

    <!-- PALCO DE PRÉ-VISUALIZAÇÃO LIMPA COM IFRAME -->
    <main id="conteudo-principal" class="bcb-harness-main">
        <h1 class="sr-only">Visualizador Técnico de Protótipos — Banco Central do Brasil</h1>

        <div id="previewStage" class="bcb-harness-stage mode-desktop">
            <div id="previewFrameWrapper" class="bcb-harness-device viewport-desktop">
                <iframe id="previewFrame" class="bcb-harness-frame" title="Quadro de Visualização do Protótipo Oficial" src="copom-decisao-taxa-selic.html"></iframe>
            </div>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            const frame = document.getElementById('previewFrame');
            const previewStage = document.getElementById('previewStage');
            const previewFrameWrapper = document.getElementById('previewFrameWrapper');
            const selectPrototipo = document.getElementById('selectPrototipo');
            const viewportButtons = document.querySelectorAll('[data-viewport]');
            const btnOpenNewTab = document.getElementById('btnOpenNewTab');

            function setViewport(viewport) {
                viewportButtons.forEach(btn => {
                    const isActive = btn.getAttribute('data-viewport') === viewport;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                });

                if (previewStage && previewFrameWrapper) {
                    previewStage.className = `bcb-harness-stage mode-${viewport}`;
                    previewFrameWrapper.className = `bcb-harness-device viewport-${viewport}`;
                }
            }

            function loadPrototype(slug) {
                if (btnOpenNewTab) {
                    btnOpenNewTab.href = slug;
                }
                if (frame) {
                    frame.src = slug;
                }
            }

            selectPrototipo.addEventListener('change', (e) => {
                const val = e.target.value;
                const slug = val.split('/').pop();
                loadPrototype(slug);
            });

            viewportButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setViewport(btn.getAttribute('data-viewport'));
                });
            });

            // Suporte a abertura parametrizada: _harness.html?src=nome.html
            const urlParams = new URLSearchParams(window.location.search);
            const paramSrc = urlParams.get('src');

            let prototipoInicial = 'copom-decisao-taxa-selic.html';
            if (paramSrc) {
                prototipoInicial = paramSrc;
                for (let i = 0; i < selectPrototipo.options.length; i++) {
                    if (selectPrototipo.options[i].value === paramSrc || selectPrototipo.options[i].value.endsWith(paramSrc)) {
                        selectPrototipo.selectedIndex = i;
                        break;
                    }
                }
            }

            loadPrototype(prototipoInicial.split('/').pop());
        })();
    </script>
</body>
</html>
