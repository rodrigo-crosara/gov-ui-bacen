<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-contrast="normal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Técnico de Protótipos — BCB Design System</title>
    <meta name="description" content="Casca técnica mínima sem elementos fixos de portal para testes visuais e de contraste de protótipos de miolo do BCB.">

    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <!-- Tipografia Institucional (Rawline, Inter, Ubuntu, Cormorant Garamond, Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined & Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">

    <!-- BCB Design System CSS -->
    <link rel="stylesheet" href="../assets/css/bcb-style.css">

    <style>
        /* Toolbar técnica de controle — exclusiva para desenvolvimento e testes */
        .bcb-harness-bar {
            background-color: #1a2228;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .bcb-harness-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
        }
        .bcb-harness-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bcb-harness-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bcb-harness-select {
            background: #2a343d;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            outline: none;
        }
        .bcb-harness-theme-group {
            display: flex;
            background: #2a343d;
            border-radius: 4px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bcb-harness-theme-btn {
            background: transparent;
            border: none;
            color: #c4cbd1;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }
        .bcb-harness-theme-btn.active {
            background: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
            font-weight: 600;
        }
        .bcb-harness-frame {
            width: 100%;
            height: calc(100vh - 45px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- BARRA TÉCNICA DE CONTROLE (Exclusiva do Harness / Ocultada em Produção) -->
    <header class="bcb-harness-bar" role="banner" aria-label="Controles do Harness">
        <a href="../pages/templates.html" class="bcb-harness-title">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;" aria-hidden="true">dashboard</span>
            <span>Harness de Visualização Técnica</span>
            <span class="bcb-harness-badge">Protótipos BCB</span>
        </a>

        <div class="bcb-harness-controls">
            <label for="selectPrototipo" class="mb-0 text-muted small mr-1">Protótipo:</label>
            <select id="selectPrototipo" class="bcb-harness-select" aria-label="Selecionar protótipo para visualização">
                <option value="copom-decisao-taxa-selic.html">Copom: Decisão da Taxa Selic &amp; Série SGS</option>
                <option value="../templates/testes-poc/template-indicadores.html">[POC] Indicadores Econômicos</option>
                <option value="../templates/testes-poc/template-noticia.html">[POC] Notícia &amp; Comunicado</option>
                <option value="../templates/testes-poc/template-servico.html">[POC] Serviço ao Cidadão &amp; FAQ</option>
                <option value="../templates/testes-poc/drex.html">[POC] Drex / Produtos Estratégicos</option>
                <option value="../templates/testes-poc/planejando-a-aposentadoria.html">[POC] Planejamento da Aposentadoria</option>
                <option value="../templates/testes-poc/desastres-naturais.html">[POC] Orientações em Emergências</option>
            </select>

            <div class="bcb-harness-theme-group" role="group" aria-label="Alternador de tema do protótipo">
                <button type="button" class="bcb-harness-theme-btn active" data-theme-target="default">Padrão</button>
                <button type="button" class="bcb-harness-theme-btn" data-theme-target="dark">Escuro</button>
                <button type="button" class="bcb-harness-theme-btn" data-theme-target="high-contrast">Contraste</button>
            </div>
        </div>
    </header>

    <!-- QUADRO DE VISUALIZAÇÃO DO MIOLO DO PROTÓTIPO -->
    <main id="conteudo-principal">
        <h1 class="sr-only">Visualizador Técnico de Protótipos — Banco Central do Brasil</h1>
        <iframe id="previewFrame" class="bcb-harness-frame" src="copom-decisao-taxa-selic.html" title="Visualização do Protótipo"></iframe>
    </main>

    <script>
        (function() {
            const frame = document.getElementById('previewFrame');
            const selectPrototipo = document.getElementById('selectPrototipo');
            const themeButtons = document.querySelectorAll('[data-theme-target]');
            let currentTheme = 'default';

            function applyThemeToFrame(theme) {
                currentTheme = theme;
                themeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-theme-target') === theme);
                });

                try {
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    if (doc && doc.documentElement) {
                        if (theme === 'dark') {
                            doc.documentElement.setAttribute('data-theme', 'dark');
                            doc.documentElement.setAttribute('data-contrast', 'normal');
                        } else if (theme === 'high-contrast') {
                            doc.documentElement.setAttribute('data-theme', 'high-contrast');
                            doc.documentElement.setAttribute('data-contrast', 'high');
                        } else {
                            doc.documentElement.setAttribute('data-theme', 'light');
                            doc.documentElement.setAttribute('data-contrast', 'normal');
                        }
                    }
                } catch(e) {
                    console.warn('Cross-origin or frame not ready:', e);
                }
            }

            selectPrototipo.addEventListener('change', (e) => {
                frame.src = e.target.value;
            });

            frame.addEventListener('load', () => {
                applyThemeToFrame(currentTheme);
            });

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    applyThemeToFrame(btn.getAttribute('data-theme-target'));
                });
            });
        })();
    </script>
</body>
</html>
