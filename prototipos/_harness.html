<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-contrast="normal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Técnico de Protótipos — BCB Design System</title>
    <meta name="description" content="Visualizador técnico para homologação de responsividade e visualização de protótipos autônomos do Banco Central do Brasil.">

    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <!-- Tipografia Institucional (Rawline, Inter, Ubuntu, Cormorant Garamond, Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined & Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">

    <!-- BCB Design System CSS -->
    <link rel="stylesheet" href="../assets/css/bcb-style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1418;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: var(--bcb-font-ubuntu, sans-serif);
        }

        /* Toolbar técnica de controle */
        .bcb-harness-bar {
            background-color: #1a2228;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            z-index: 1000;
        }

        .bcb-harness-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
        }
        .bcb-harness-title:hover {
            color: #4dc8ff;
            text-decoration: none;
        }

        .bcb-harness-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c4cbd1;
        }

        .bcb-harness-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .bcb-harness-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bcb-harness-label {
            font-size: 0.75rem;
            color: #9aa6b2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0;
        }

        .bcb-harness-select {
            background: #2a343d;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.82rem;
            outline: none;
            min-width: 260px;
        }
        .bcb-harness-select:focus {
            border-color: #4dc8ff;
        }

        .bcb-harness-btn-group {
            display: flex;
            background: #2a343d;
            border-radius: 4px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .bcb-harness-btn {
            background: transparent;
            border: none;
            color: #c4cbd1;
            padding: 5px 12px;
            font-size: 0.78rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }
        .bcb-harness-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            text-decoration: none;
        }
        .bcb-harness-btn.active {
            background: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
            font-weight: 600;
        }

        .bcb-harness-btn--action {
            background: #2a343d;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .bcb-harness-btn--action:hover {
            background: rgba(2, 92, 117, 0.4);
            border-color: var(--bcb-brand-azul-blue, #025C75);
            color: #ffffff;
        }

        /* Container principal */
        .bcb-harness-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background-color: #0f1418;
            height: calc(100vh - 49px);
        }

        /* Palco de renderização (#previewStage) */
        #previewStage {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            background-color: #0f1418;
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* Container do dispositivo / iframe (#previewFrameWrapper) */
        #previewFrameWrapper {
            background: #ffffff;
            transition: width 0.25s ease, max-width 0.25s ease, height 0.25s ease, box-shadow 0.25s ease, border 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* MODO DESKTOP: 100% da largura e altura disponíveis, sem moldura visual */
        #previewStage.mode-desktop {
            padding: 0;
            overflow: hidden;
            align-items: stretch;
        }

        #previewFrameWrapper.viewport-desktop {
            width: 100%;
            height: 100%;
            max-width: 100%;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* MODO TABLET (768px): centralizado com moldura visual */
        #previewStage.mode-tablet {
            padding: 24px 16px;
            overflow-y: auto;
            align-items: flex-start;
        }

        #previewFrameWrapper.viewport-tablet {
            width: 768px;
            max-width: 100%;
            height: 90vh;
            min-height: 700px;
            border-radius: 12px;
            border: 8px solid #2a343d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* MODO MOBILE (375px): centralizado com moldura visual */
        #previewStage.mode-mobile {
            padding: 24px 16px;
            overflow-y: auto;
            align-items: flex-start;
        }

        #previewFrameWrapper.viewport-mobile {
            width: 375px;
            max-width: 100%;
            height: 90vh;
            min-height: 640px;
            border-radius: 24px;
            border: 10px solid #2a343d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Iframe do protótipo */
        .bcb-harness-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
            flex: 1;
        }

        /* Gaveta Lateral Retrátil de Demandas (Offcanvas à direita) */
        .bcb-doc-drawer {
            position: fixed;
            top: 49px;
            right: 0;
            bottom: 0;
            width: 420px;
            max-width: 90vw;
            background-color: #1a2228;
            color: #ffffff;
            box-shadow: -6px 0 24px rgba(0, 0, 0, 0.55);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }

        .bcb-doc-drawer.open {
            transform: translateX(0);
        }

        .bcb-doc-drawer-header {
            padding: 12px 16px;
            background-color: #151c21;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .bcb-doc-drawer-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }

        .bcb-doc-drawer-close {
            background: transparent;
            border: none;
            color: #9aa6b2;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
        }

        .bcb-doc-drawer-close:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .bcb-doc-drawer-toolbar {
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 8px;
        }

        .bcb-doc-file-badge {
            font-size: 0.75rem;
            font-family: monospace;
            background: rgba(2, 92, 117, 0.35);
            border: 1px solid rgba(2, 92, 117, 0.6);
            color: #7dd3fc;
            padding: 2px 8px;
            border-radius: 4px;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bcb-doc-link {
            font-size: 0.75rem;
            color: #4dc8ff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .bcb-doc-link:hover {
            color: #90ddff;
            text-decoration: underline;
        }

        .bcb-doc-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #d0d7df;
            word-break: break-word;
        }

        .bcb-doc-content pre {
            background: #0f1418;
            color: #e6edf3;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.78rem;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        }

        .bcb-doc-content h1,
        .bcb-doc-content h2,
        .bcb-doc-content h3 {
            color: #ffffff;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .bcb-doc-content h1 { font-size: 1.15rem; border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 4px; }
        .bcb-doc-content h2 { font-size: 1.05rem; }
        .bcb-doc-content h3 { font-size: 0.95rem; }

        .bcb-doc-content ul, .bcb-doc-content ol {
            padding-left: 20px;
            margin-bottom: 1rem;
        }

        .bcb-doc-content code {
            background: rgba(255, 255, 255, 0.1);
            color: #7dd3fc;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.8em;
        }

        .bcb-doc-content blockquote {
            border-left: 3px solid var(--bcb-brand-azul-blue, #025C75);
            padding-left: 10px;
            margin: 10px 0;
            color: #9aa6b2;
            font-style: italic;
        }

        .bcb-doc-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            padding: 12px;
            color: #fca5a5;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .bcb-doc-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9aa6b2;
            padding: 16px 0;
            font-size: 0.82rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        :focus-visible {
            outline: 3px solid #088694 !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body>

    <!-- BARRA TÉCNICA DE CONTROLE -->
    <header class="bcb-harness-bar" role="banner" aria-label="Controles do Visualizador de Protótipos">
        <a href="../pages/prototipos.html" class="bcb-harness-title">
            <span class="material-symbols-outlined material-icons md-18" aria-hidden="true">arrow_back</span>
            <span>Visualizador de Protótipos</span>
            <span class="bcb-harness-badge">BCB</span>
        </a>

        <div class="bcb-harness-controls">
            <!-- Seletor de Protótipos -->
            <div class="bcb-harness-group">
                <label for="selectPrototipo" class="bcb-harness-label">Tela:</label>
                <select id="selectPrototipo" class="bcb-harness-select" aria-label="Selecionar protótipo para visualização">
                    <option value="copom-decisao-taxa-selic.html">Copom: Taxa Selic &amp; Série SGS 432</option>
                    <option value="sgs-series-taxa-selic.html">SGS: Painel Analítico &amp; Dados Abertos</option>
                    <option value="mecanismo-especial-devolucao-med.html">Serviço: MED Pix com Stepper e Alerta</option>
                    <option value="regras-cheque-especial.html">Regulação: Limite Cheque Especial (70/30)</option>
                    <option value="resolucao-bcb-dou.html">Regulação: Resolução BCB nº 492 (DOU / Comef)</option>
                </select>
            </div>

            <!-- Alternador de Resolução (Desktop, Tablet 768px, Mobile 375px) -->
            <div class="bcb-harness-group">
                <span class="bcb-harness-label">Resolução:</span>
                <div class="bcb-harness-btn-group" role="group" aria-label="Alternador de resolução">
                    <button type="button" class="bcb-harness-btn active" data-viewport="desktop" title="Desktop (100%)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">desktop_windows</span> Desktop
                    </button>
                    <button type="button" class="bcb-harness-btn" data-viewport="tablet" title="Tablet (768px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">tablet_mac</span> Tablet (768px)
                    </button>
                    <button type="button" class="bcb-harness-btn" data-viewport="mobile" title="Mobile (375px)">
                        <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">smartphone</span> Mobile (375px)
                    </button>
                </div>
            </div>

            <!-- Controles de Ação (Ver Demanda e Abrir Isolado) -->
            <div class="bcb-harness-group">
                <button type="button" id="toggleDocBtn" class="bcb-harness-btn bcb-harness-btn--action" aria-expanded="false" aria-controls="docDrawer" title="Visualizar documento de demanda (.md)">
                    <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">description</span>
                    <span>Ver Demanda</span>
                </button>

                <a id="btnOpenNewTab" href="copom-decisao-taxa-selic.html" target="_blank" rel="noopener noreferrer" class="bcb-harness-btn bcb-harness-btn--action" title="Abrir protótipo diretamente em nova aba">
                    <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">open_in_new</span>
                    <span>Abrir em nova aba</span>
                </a>
            </div>
        </div>
    </header>

    <!-- PALCO DE PRÉ-VISUALIZAÇÃO LIMPA COM IFRAME -->
    <main id="conteudo-principal" class="bcb-harness-main">
        <h1 class="sr-only">Visualizador Técnico de Protótipos — Banco Central do Brasil</h1>

        <div id="previewStage" class="bcb-harness-stage mode-desktop">
            <div id="previewFrameWrapper" class="bcb-harness-device viewport-desktop">
                <iframe id="previewFrame" class="bcb-harness-frame" title="Quadro de Visualização do Protótipo Oficial" src="copom-decisao-taxa-selic.html"></iframe>
            </div>
        </div>
    </main>

    <!-- GAVETA RETRÁTIL DE DEMANDAS (DRAWER OFFCANVAS À DIREITA) -->
    <aside id="docDrawer" class="bcb-doc-drawer" aria-label="Painel de Documento de Demanda" aria-hidden="true">
        <div class="bcb-doc-drawer-header">
            <div class="d-flex align-items-center" style="gap: 8px;">
                <span class="material-symbols-outlined material-icons md-18 text-info" aria-hidden="true">description</span>
                <h2 class="bcb-doc-drawer-title" id="docDrawerTitle">Documento de Demanda</h2>
            </div>
            <button type="button" id="closeDocBtn" class="bcb-doc-drawer-close" aria-label="Fechar gaveta de demanda">
                <span class="material-symbols-outlined material-icons md-18" aria-hidden="true">close</span>
            </button>
        </div>
        <div class="bcb-doc-drawer-toolbar" id="docDrawerToolbar">
            <span id="docFileName" class="bcb-doc-file-badge">Nenhum arquivo</span>
            <a id="docExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="bcb-doc-link" style="display: none;">
                <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">open_in_new</span>
                <span>Abrir .md puro</span>
            </a>
        </div>
        <div class="bcb-doc-drawer-body" id="docDrawerBody">
            <div id="docLoading" class="bcb-doc-loading" style="display: none;">
                <div class="spinner-border spinner-border-sm text-info" role="status">
                    <span class="sr-only">Carregando documento...</span>
                </div>
                <span>Carregando documento de demanda...</span>
            </div>
            <div id="docError" class="bcb-doc-error" style="display: none;"></div>
            <div id="docContent" class="bcb-doc-content"></div>
        </div>
    </aside>

    <script>
        (function() {
            'use strict';

            const frame = document.getElementById('previewFrame');
            const previewStage = document.getElementById('previewStage');
            const previewFrameWrapper = document.getElementById('previewFrameWrapper');
            const selectPrototipo = document.getElementById('selectPrototipo');
            const viewportButtons = document.querySelectorAll('[data-viewport]');
            const btnOpenNewTab = document.getElementById('btnOpenNewTab');

            // Elementos da Gaveta de Demanda
            const toggleDocBtn = document.getElementById('toggleDocBtn');
            const closeDocBtn = document.getElementById('closeDocBtn');
            const docDrawer = document.getElementById('docDrawer');
            const docDrawerTitle = document.getElementById('docDrawerTitle');
            const docFileName = document.getElementById('docFileName');

                '03-servico-passo-a-passo.md': {

                    objetivo: 'Converter publicação bruta do DOU com dados regulatórios e coeficientes de capital em página institucional.',
                    padraoUX: 'Atos Normativos / Resoluções com Metadados Oficiais e Download',
                    textoBruto: 'BANCO CENTRAL DO BRASIL\nRESOLUÇÃO BCB Nº 492, DE 2 DE SETEMBRO DE 2026\nFixa o valor do Adicional Contracíclico de Capital do Banco Central do Brasil para o Brasil (ACCPBrasil).\nA Diretoria Colegiada do Banco Central do Brasil, em sessão realizada em 2 de setembro de 2026...'
                }
            };

            let currentDocName = '';

            function toggleDocDrawer(forceState) {
                const isOpen = typeof forceState === 'boolean' ? forceState : !docDrawer.classList.contains('open');
                docDrawer.classList.toggle('open', isOpen);
                docDrawer.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
                if (toggleDocBtn) {
                    toggleDocBtn.classList.toggle('active', isOpen);
                    toggleDocBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                }
            }

            function renderSimpleMarkdown(md) {
                if (!md) return '';
                let html = md
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                // Code blocks
                html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                // Inline code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                // Headings (Mapeados para h2, h3 e h4 preservando a hierarquia da página)
                html = html.replace(/^### (.*$)/gim, '<h4 class="bcb-doc-h4">$1</h4>');
                html = html.replace(/^## (.*$)/gim, '<h3 class="bcb-doc-h3">$1</h3>');
                html = html.replace(/^# (.*$)/gim, '<h2 class="bcb-doc-h2">$1</h2>');
                // Bold & Italic
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                // Blockquote
                html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');
                // List items
                html = html.replace(/^\s*[-*]\s+(.*$)/gim, '<li>$1</li>');
                html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
                html = html.replace(/<\/ul>\s*<ul>/g, '');

                // Paragraphs
                html = html.replace(/\n\n+/g, '</p><p>');
                html = `<p>${html}</p>`;
                html = html.replace(/<p>\s*<\/p>/g, '');
                html = html.replace(/<p>(<h[2-4]>)/g, '$1');
                html = html.replace(/(<\/h[2-4]>)<\/p>/g, '$1');
                html = html.replace(/<p>(<pre>)/g, '$1');
                html = html.replace(/(<\/pre>)<\/p>/g, '$1');
                html = html.replace(/<p>(<ul>)/g, '$1');
                html = html.replace(/(<\/ul>)<\/p>/g, '$1');
                html = html.replace(/<p>(<blockquote>)/g, '$1');
                html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');

                return html;
            }

            async function loadDoc(docName) {
                if (!docName) return;
                if (!docName.endsWith('.md')) {
                    docName += '.md';
                }
                currentDocName = docName;
                const docPath = `../.docs-ia/exemplos-demandas/${docName}`;

                if (docFileName) docFileName.textContent = docName;
                if (docExternalLink) {
                    docExternalLink.href = docPath;
                    docExternalLink.style.display = 'inline-flex';
                }
                if (docLoading) docLoading.style.display = 'flex';
                if (docError) docError.style.display = 'none';
                if (docContent) docContent.innerHTML = '';

                try {
                    const response = await fetch(docPath);
                    if (!response.ok) {
                        throw new Error(`Arquivo não encontrado (Status HTTP ${response.status})`);
                    }
                    const text = await response.text();
                    if (docLoading) docLoading.style.display = 'none';
                    if (docContent) docContent.innerHTML = renderSimpleMarkdown(text);
                } catch (err) {
                    if (docLoading) docLoading.style.display = 'none';
                    const isFileProtocol = window.location.protocol === 'file:';

                    let errorHtml = `
                        <div class="alert alert-warning p-2 small mb-3" style="background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); color: #fde68a;">
                            <strong>${isFileProtocol ? 'Aviso de Visualização Local (file:///):' : 'Não foi possível carregar via HTTP:'}</strong><br>
                            ${isFileProtocol 
                                ? 'Navegadores bloqueiam requisições assíncronas a arquivos locais por segurança. Você pode abrir o markdown bruto pelo link abaixo ou utilizar um servidor local (<code>npm run serve</code>).' 
                                : err.message}
                        </div>
                        <div class="text-center my-3">
                            <a href="${docPath}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm d-inline-flex align-items-center" style="gap: 6px;">
                                <span class="material-symbols-outlined material-icons md-16" aria-hidden="true">open_in_new</span>
                                <span>Abrir ${docName} no Navegador</span>
                            </a>
                        </div>
                    `;
                    if (docError) {
                        docError.innerHTML = errorHtml;
                        docError.style.display = 'block';
                    }

                    if (DEMANDAS_FALLBACK[docName] && docContent) {
                        const fb = DEMANDAS_FALLBACK[docName];
                        docContent.innerHTML = `
                            <div class="card p-3 mb-3" style="background: #151c21; border: 1px solid rgba(255,255,255,0.1);">
                                <h3 class="h6 text-white font-weight-bold mb-2">${fb.titulo}</h3>
                                <div class="small text-muted mb-1"><strong>Origem:</strong> ${fb.origem}</div>
                                <div class="small text-muted mb-1"><strong>Padrão UX:</strong> ${fb.padraoUX}</div>
                                <div class="small text-muted mb-0"><strong>Objetivo:</strong> ${fb.objetivo}</div>
                            </div>
                            <h4 class="h6 text-white font-weight-bold mb-2">Insumo da Demanda:</h4>
                            <pre><code>${fb.textoBruto}</code></pre>
                        `;
                    }
                }
            }

            function setViewport(viewport) {
                viewportButtons.forEach(btn => {
                    const isActive = btn.getAttribute('data-viewport') === viewport;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                });

                if (previewStage && previewFrameWrapper) {
                    previewStage.className = `bcb-harness-stage mode-${viewport}`;
                    previewFrameWrapper.className = `bcb-harness-device viewport-${viewport}`;
                }
            }

            function loadPrototype(slug) {
                if (btnOpenNewTab) {
                    btnOpenNewTab.href = slug;
                }
                if (frame) {
                    frame.src = slug;
                }
                const mappedDoc = PROTOTYPE_DOC_MAP[slug];
                if (mappedDoc) {
                    loadDoc(mappedDoc);
                }
            }

            selectPrototipo.addEventListener('change', (e) => {
                const val = e.target.value;
                const slug = val.split('/').pop();
                loadPrototype(slug);
            });

            viewportButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setViewport(btn.getAttribute('data-viewport'));
                });
            });

            if (toggleDocBtn) {
                toggleDocBtn.addEventListener('click', () => {
                    toggleDocDrawer();
                });
            }

            if (closeDocBtn) {
                closeDocBtn.addEventListener('click', () => {
                    toggleDocDrawer(false);
                });
            }

            // Fechamento da gaveta via tecla Escape (WCAG a11y)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' || e.key === 'Esc') {
                    if (docDrawer && docDrawer.classList.contains('open')) {
                        toggleDocDrawer(false);
                    }
                }
            });

            // Leitura automática dos parâmetros da URL: ?src=...&doc=... ou ?file=...&doc=...
            const urlParams = new URLSearchParams(window.location.search);
            const paramSrc = urlParams.get('src') || urlParams.get('file');
            const paramDoc = urlParams.get('doc');

            let prototipoInicial = 'copom-decisao-taxa-selic.html';
            if (paramSrc) {
                const cleanSrc = paramSrc.toLowerCase().replace('.html', '');
                for (let i = 0; i < selectPrototipo.options.length; i++) {
                    const optVal = selectPrototipo.options[i].value.toLowerCase();
                    if (optVal === paramSrc.toLowerCase() || optVal.includes(cleanSrc)) {
                        selectPrototipo.selectedIndex = i;
                        prototipoInicial = selectPrototipo.options[i].value;
                        break;
                    }
                }
            }

            const slugInicial = prototipoInicial.split('/').pop();
            loadPrototype(slugInicial);

            // Carregamento específico do documento de demanda passado por parâmetro
            if (paramDoc) {
                loadDoc(paramDoc);
                toggleDocDrawer(true);
            }
        })();
    </script>
</body>
</html>
