name: CI — Design System BCB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-e-testes:
    name: Lint, Integridade e Conformidade Modular
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronização de Design Tokens (W3C / CSS)
        run: npm run check:tokens-sync

      - name: Lint CSS (Stylelint)
        run: npm run lint:css

      - name: Lint HTML (HTMLHint)
        run: npm run lint:html

      - name: Testes de integridade de tokens (Paleta Oficial BCB e Variáveis)
        run: npm run test:tokens

      - name: Testes de integridade semântica HTML e e-MAG 3.1 (Documentação e Miolos)
        run: npm run test:html

      - name: Linter de Protótipos, Modularidade de Grid 12 e Componentes (Sem amarras a cascas)
        run: npm run test:prototipos

      - name: Linter Dedicado de Protótipos (prototipos/)
        run: npm run lint:prototypes

  acessibilidade:
    name: Acessibilidade Dinâmica (WCAG 2.2 / e-MAG)
    runs-on: ubuntu-latest
    needs: lint-e-testes
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar servidor local
        run: npx http-server . -p 8080 -c-1 &
        
      - name: Aguardar servidor
        run: sleep 3

      - name: Auditoria de acessibilidade mandatória (WCAG 2.2 AA / pa11y cobrindo prototipos/ e portal)
        run: npm run test:a11y

      - name: Auditoria de acessibilidade bloqueante dos protótipos oficiais (WCAG 2.1 AA)
        run: npm run test:a11y:prototypes
